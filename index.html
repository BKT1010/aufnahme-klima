<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aufnahme Klima</title>
<meta name="theme-color" content="#1f5f8b">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--blau:#1f5f8b;--hell:#eef4f8;--rand:#c9d6df;--text:#1d2329;--grau:#5b6770;--rot:#b3261e;--rotbg:#fdecea;--gruen:#1e7b3a;--gruenbg:#e7f5ec;}
*{box-sizing:border-box}
html,body{margin:0;background:#f6f8fa;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px}
header{position:sticky;top:0;z-index:5;background:var(--blau);color:#fff;display:flex;align-items:center;gap:8px;padding:10px 14px;flex-wrap:wrap}
header h1{font-size:19px;margin:0 12px 0 0;font-weight:600}
header nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
header nav button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:8px;padding:9px 14px;font-size:16px}
header nav button.on{background:#fff;color:var(--blau);font-weight:600}
#qinfo{font-size:14px;background:#f0b429;color:#222;border-radius:12px;padding:4px 10px;display:none}
main{max-width:980px;margin:0 auto;padding:16px 14px 65vh}
h2{font-size:21px;margin:8px 0 14px}
h3{font-size:18px;margin:0 0 10px}
h4{font-size:16px;margin:14px 0 8px;color:var(--grau);text-transform:uppercase;letter-spacing:.04em}
.card{background:#fff;border:1px solid var(--rand);border-radius:12px;padding:16px;margin-bottom:16px}
.sub{background:var(--hell);border:1px solid var(--rand);border-radius:10px;padding:12px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--grau)}
input,select,textarea{font:inherit;color:var(--text);border:1px solid var(--rand);border-radius:8px;padding:11px 12px;background:#fff;min-height:48px;width:100%}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blau);outline-offset:0}
.bad,.tog.bad button{border:2px solid var(--rot)!important;background:var(--rotbg)}
.tog{display:flex;flex-wrap:wrap;gap:6px}
.tog button{min-height:48px;padding:0 13px;border:1px solid var(--rand);background:#fff;border-radius:8px;font:inherit;color:var(--text)}
.tog button.on{background:var(--blau);border-color:var(--blau);color:#fff;font-weight:600}
.btn{min-height:52px;padding:0 20px;border-radius:10px;border:1px solid var(--blau);background:#fff;color:var(--blau);font:inherit;font-weight:600}
.btn.p{background:var(--blau);color:#fff}
.btn.del{border-color:var(--rot);color:var(--rot);min-height:40px;padding:0 12px;font-weight:500}
.btn.big{width:100%;min-height:64px;font-size:18px;margin-bottom:12px;text-align:left;padding:0 20px}
.btn.ort{min-height:44px;font-weight:500}
.btn.k{width:100%;text-align:left;min-height:48px;font-weight:500;margin-bottom:6px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.info{font-size:14px;color:var(--grau)}
.auto{background:#f1f3f5;border-radius:8px;padding:11px 12px;min-height:48px;display:flex;align-items:center}
.ok{background:var(--gruenbg);color:var(--gruen);border-radius:8px;padding:10px 12px;font-weight:600;margin-top:6px}
.err{background:var(--rotbg);color:var(--rot);border-radius:8px;padding:10px 12px;font-weight:600;margin-top:6px}
.hint{background:#fff7e0;border:1px solid #f0d58a;border-radius:8px;padding:10px 12px;margin-top:6px}
.neutral{background:#f1f3f5;border-radius:8px;padding:10px 12px;margin-top:6px}
.fn{font-family:ui-monospace,monospace;font-size:15px;word-break:break-all}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:10px;max-width:90%;display:none;z-index:20}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:15;padding:16px}
#modal .box{background:#fff;border-radius:14px;max-width:620px;width:100%;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.3);max-height:92vh;overflow:auto}
#modal h3.rot{color:var(--rot)}
#modal ul{padding-left:20px;margin:8px 0 16px}
.liste{max-height:50vh;overflow:auto;margin:10px 0}
.hidden{display:none}
</style>
</head>
<body>
<header>
  <h1>Aufnahme Klima</h1>
  <nav id="nav"></nav>
  <span id="qinfo" data-act="view" data-v="einst"></span>
</header>
<main id="app"></main>
<input type="file" id="datei" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" class="hidden">
<div id="modal"><div class="box" id="modalbox"></div></div>
<div id="toast"></div>

let PLZMAP=null,PLZKOORD=null;
function plzLaden(){if(PLZMAP||typeof PLZDATA!=='string')return;PLZMAP=new Map();PLZKOORD=[];

function fahrt(p){const E=S.einst,basis=plzPos(str(E.basisPlz));if(!basis)return{zone:null,grund:'Firmen-PLZ unbekannt'};
  let pos=null,quelle='';
  if(/^\d{5}$/.test(str(p.plz))){pos=plzPos(str(p.plz));quelle='PLZ '+str(p.plz)}
  if(!pos&&str(p.ort)){pos=ortPos(p.ort,basis);if(pos)quelle='Ort '+str(p.ort)+' (PLZ abgeleitet: '+pos.plz+')'}

  const km=distKm(basis.la,basis.lo,pos.la,pos.lo),gr=(E.zonen||[]).map(num);
  let z=null;for(let k=0;k<gr.length;k++){if(gr[k]!=null&&km<=gr[k]+1e-9){z=k+1;break}}
  return{zone:z,km,quelle,artikel:z?'Fahrt Zone '+z:'Fahrt Sonderzone'}}

function exportMaterial(p){const s=sammel(),kanal=new Map(),blech=new Map();let schlauch=0,ig=0;const km=new Map();

  });

  kanal.forEach((m,t)=>s.add('Kabelkanal',t,Math.ceil(m/STUECK_M-1e-9),matEinheit(t,'Stk')));
  blech.forEach((m,t)=>s.add('Blechkanal',t,Math.ceil(m/STUECK_M-1e-9),'Stk'));
  if(schlauch>0){const m=Math.ceil(r2(schlauch));s.add('Kondensat',ART.schlauch,m,'m');s.add('Elektro',ART.nym,m,'m')}
  if(ig)s.add('Kleinmaterial',ART.kleinmaterial,ig,'Stk');
  if(ig){const st=montageStunden(p);s.add('Montage',ART.planung,1,'Stk');s.add('Montage',ART.beratung,1,'Stk');s.add('Montage',ART.m,st,'h');
    const f=fahrt(p);if(f.artikel)s.add('Fahrt',f.artikel,Math.ceil(st/(num(S.einst.stundenProFahrt)||16)-1e-9),'Stk');
    s.add('Option Premium Upgrade',ART.loet,ig,'Stk');s.add('Option Premium Upgrade',ART.kleinmaterial,ig*0.5,'Stk')}
  const ord=['Kältemittelleitung','Kältemittel','Kabelkanal','Blechkanal','Kondensatpumpe','Kondensat','Elektro','Zuleitung','Konsole','Montagezubehör','Kernloch','Lackierung','Kleinmaterial','Montage','Fahrt','Option Premium Upgrade'];
  return s.rows().map(r=>(r[2]=r2(r[2]),r)).sort((x,y)=>ord.indexOf(x[0])-ord.indexOf(y[0])||x[1].localeCompare(y[1],'de'))}

// ================= Logik bei Änderungen =================
function nachAenderung(path){
  if(path==='kunde.ort'){S.kunde.ortAuto=false;return}
  const m=path.match(/^projekt\.anlagen\.(\d+)\.(.+)$/);
  if(!m)return;
  const a=S.projekt.anlagen[+m[1]],f=m[2];
  if(f==='art'){const art=a.art,keep={montage:a.montage,daemmung:a.daemmung,zuleitung:a.zuleitung,blechTyp:a.blechTyp,blechLaenge:a.blechLaenge,blechAusf:a.blechAusf,lack:a.lack,ralNr:a.ralNr,kern:a.kern,geaendert:true};
    Object.assign(a,neueAnlage(true),keep,{art});a.hersteller=stdHersteller(art);a.innen=art==='Singlesplit'?[neuesInnen()]:[];kernAuto(a)}
  else if(f==='hersteller'){a.aussen='';a.leistung=null;a.daten=null;a.innen=a.art==='Singlesplit'?[keepInnen(a.innen[0])]:[];kernAuto(a)}
  else if(f==='aussen'&&a.art==='Multisplit'){
    const g=L.mAussen.find(x=>x.h===a.hersteller&&x.typ===a.aussen);
    a.leistung=g?g.max:null;const n=g?g.anzahl:0;
    while(a.innen.length<n)a.innen.push(neuesInnen());
    a.innen=a.innen.slice(0,n);a.daten=null;aktualisiereDaten(a);kernAuto(a)}
  else if(f==='montage'){a.daemmung=a.montage==='Wandkonsole'?(a.daemmung||STD().daemmung||'Ungedämmt'):''}
  else if(/^kern\.\d+\.anzahl$/.test(f)){a.kern[+f.split('.')[1]].auto=false}
  else{const mp=f.match(/^innen\.(\d+)\.pumpe$/);if(mp){const u=a.innen[+mp[1]];u.pumpeTyp=u.pumpe==='Ja'?(u.pumpeTyp||STD().pumpeTyp||''):'';return}
    const mi=f.match(/^innen\.(\d+)\.typ$/);
    if(mi){const u=a.innen[+mi[1]];u.rohr='';
      if(a.art==='Singlesplit'){const k=L.single.find(x=>x.h===a.hersteller&&x.innen===u.typ);a.aussen=k?k.aussen:'';a.leistung=k?k.leistung:null;u.leistung=k?k.leistung:null;a.daten=null}
      else{const k=L.mInnen.find(x=>x.h===a.hersteller&&x.typ===u.typ);u.leistung=k?k.leistung:null}
      aktualisiereDaten(a)}}
}
function keepInnen(u){const n=neuesInnen();if(!u)return n;return Object.assign(n,u,{typ:'',leistung:null,rohr:''})}

// ================= Gerätewahl Serie -> Größe -> Farbe =================
const STD_GROESSE=2.5;
function serienListe(l){const m=new Map();l.forEach(x=>{const s=x.serie||'Sonstige';if(!m.has(s))m.set(s,false);if(x.fav)m.set(s,true)});
  return[...m.entries()].sort((a,b)=>(b[1]-a[1])).map(e=>e[0])}
function wahlZustand(u,l){const g=l.find(x=>x.typ===u.typ);
  if(g)return{serie:g.serie||'Sonstige',groesse:g.leistung,farbe:g.farbe||''};
  return{serie:u.wSerie||'',groesse:u.wGroesse!=null?u.wGroesse:null,farbe:u.wFarbe||''}}
function aufloesen(l,serie,groesse,farbe){
  const inS=l.filter(x=>(x.serie||'Sonstige')===serie);if(!inS.length)return null;
  const gr=uniq(inS.map(x=>x.leistung)).filter(x=>x!=null);
  let g=groesse;if(g==null||!gr.includes(g)){g=gr.reduce((b,x)=>b==null||Math.abs(x-STD_GROESSE)<Math.abs(b-STD_GROESSE)?x:b,null)}
  const inG=inS.filter(x=>x.leistung===g);const fb=inG.map(x=>x.farbe||'');
  const f=fb.includes(farbe)?farbe:fb[0];
  return inG.find(x=>(x.farbe||'')===f)||inG[0]||null}
function geraetWahl(basis,u,l){
  if(!u)return'';
  if(!l.length)return fld('Innengerät',`<div class="auto">keine Geräte in der Liste</div>`);
  const z=wahlZustand(u,l),serien=serienListe(l);
  let h=fld('Serie',`<div class="tog">${serien.map(s=>`<button type="button" data-act="gw" data-b="${basis}" data-f="serie" data-v="${esc(s)}" class="${s===z.serie?'on':''}">${esc(s)}</button>`).join('')}</div>`,'full');
  if(z.serie){const inS=l.filter(x=>(x.serie||'Sonstige')===z.serie);
    const gr=uniq(inS.map(x=>x.leistung)).filter(x=>x!=null).sort((a,b)=>a-b);
    h+=fld('Größe',`<div class="tog">${gr.map(g=>`<button type="button" data-act="gw" data-b="${basis}" data-f="groesse" data-v="${g}" class="${g===z.groesse?'on':''}">${g.toFixed(1).replace(".",",")} kW</button>`).join('')}</div>`,'full');
    const fb=uniq(inS.filter(x=>x.leistung===z.groesse).map(x=>x.farbe||''));
    if(fb.length>1)h+=fld('Farbe',`<div class="tog">${fb.map(f=>`<button type="button" data-act="gw" data-b="${basis}" data-f="farbe" data-v="${esc(f)}" class="${f===z.farbe?'on':''}">${esc(f)}</button>`).join('')}</div>`);
    h+=fld('Gerät',`<div class="auto">${esc(u.typ||'–')}</div>`)}
  return h}
function geraetWaehlen(basis,feld,wert){
  const u=getP(S,basis);const m=/^projekt\.anlagen\.(\d+)\.innen\.(\d+)$/.exec(basis);if(!u||!m)return;const a=S.projekt.anlagen[+m[1]];
  const l=a.art==='Singlesplit'?L.single.filter(x=>x.h===a.hersteller).map(x=>({typ:x.innen,leistung:x.leistung,serie:x.serie,farbe:x.farbe})):L.mInnen.filter(x=>x.h===a.hersteller).map(x=>({typ:x.typ,leistung:x.leistung,serie:x.serie,farbe:x.farbe}));
  const z=wahlZustand(u,l);
  if(feld==='serie'){z.serie=wert;if(u.typ&&!l.some(x=>x.typ===u.typ&&(x.serie||'Sonstige')===wert)){}}
  if(feld==='groesse')z.groesse=num(wert);
  if(feld==='farbe')z.farbe=wert;
  const g=aufloesen(l,z.serie,feld==='serie'&&z.serie!==(l.find(x=>x.typ===u.typ)||{}).serie?(z.groesse!=null?z.groesse:STD_GROESSE):z.groesse,z.farbe);
  u.wSerie=z.serie;u.wGroesse=g?g.leistung:z.groesse;u.wFarbe=g?(g.farbe||''):z.farbe;
  u.typ=g?g.typ:'';a.geaendert=true;nachAenderung(basis+'.typ')}

let DL=null;try{if(window.claude&&typeof window.claude.use==='function')window.claude.use('downloads').then(d=>{DL=d}).catch(()=>{})}catch(e){}
async function herunterladen(wb,name){
  const blob=blobAus(wb);
  if(DL){try{await DL.save({filename:name,data:blob});toast('Gespeichert: '+name)}catch(e){if(!(e&&e.code==='declined'))toast('Speichern nicht möglich'+(e&&e.message?': '+e.message:''))}return}
  const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),10000);
  toast('Heruntergeladen: '+name)}
async function ausgeben(wb,name,art,nurDownload){
  if(nurDownload||!onedriveBereit(art))return herunterladen(wb,name);
  const u8=new Uint8Array(XLSX.write(wb,{bookType:'xlsx',type:'array'}));
  let b='';for(let i=0;i<u8.length;i+=0x8000)b+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));
  const qu=lsGet(LS_QUEUE)||[];const ord=ordnerFuer(art);
  const vorhanden=qu.findIndex(x=>x.name===name&&x.ordnerId===ord.id);
  const eintrag={name,ordnerId:ord.id,pfad:ord.pfad,art,daten:btoa(b),zeit:new Date().toLocaleString('de-DE')};
  if(vorhanden>=0)qu[vorhanden]=eintrag;else qu.push(eintrag);
  if(!lsSet(LS_QUEUE,qu)){toast('Speicher voll – Datei wird stattdessen heruntergeladen');return herunterladen(wb,name)}
  if(art==='kunde')kundeLokalMerken(name);
  queueAnzeige();
  const r=await hochladen();
  if(r.ok&&!(lsGet(LS_QUEUE)||[]).some(x=>x.name===name))toast('In OneDrive gespeichert: '+ord.pfad+'/'+name);
  else toast('Gespeichert in der Warteschlange – Upload folgt'+(r.grund?' ('+r.grund+')':''))}

function kundeSpeichern(nurDownload){
  const k=S.kunde,fehlt=[];
  if(k.typ==='Firma'&&!str(k.firma))fehlt.push(['Firmenname','kunde.firma']);
  if(k.typ!=='Firma'&&!str(k.nachname))fehlt.push(['Nachname','kunde.nachname']);
  if(!str(k.ort))fehlt.push(['Ort','kunde.ort']);
  if(fehlt.length){fehlt.forEach(([,p])=>{MARK.add(p);const el=q(p);if(el)el.classList.add('bad')});
    toast('Für den Dateinamen fehlt: '+fehlt.map(x=>x[0]).join(', '));fokus(fehlt[0][1]);return}

  const i=+t.dataset.i,k=+t.dataset.k;
  switch(act){
    case'view':S.view=t.dataset.v;MARK.clear();LETZTE_ANSICHT=null;break;
    case'gw':geraetWaehlen(t.dataset.b,t.dataset.f,t.dataset.v);render();pruefePopups();return;
    case'set':{const b=t.dataset.b;setP(S,b,t.dataset.v);unmark(b);anlageGeaendert(b);nachAenderung(b);render();pruefePopups();return}
    case'ortwahl':S.kunde.ort=t.dataset.v;S.kunde.ortAuto=true;unmark('kunde.ort');{const oe=q('kunde.ort');if(oe)oe.value=t.dataset.v}persist();derived();return;
    case'neuKunde':S.kunde=neuerKunde();S.view='kunde';MARK.clear();break;
    case'neuProjekt':S.projekt=neuesProjekt(S.kunde);S.view='projekt';MARK.clear();break;
    case'neuProjektWahl':S.projekt=neuesProjekt(null);S.view='projekt';MARK.clear();render();kundenWahl();return;
    case'kundeWaehlen':kundenWahl();return;
    case'kw-alle':KW.alle=true;zeigeKundenWahl();return;
    case'kw-wahl':{const kd=parseKunde(t.dataset.v);Object.assign(S.projekt,{kunde:kd.name,ort:kd.ort,plz:'',kundendatei:kd.datei});KW=null;schliesseModal();render();kundenPlzLaden(kd.datei);return}
    case'kw-aktuell':Object.assign(S.projekt,{kunde:kundeName(S.kunde),ort:str(S.kunde.ort),plz:str(S.kunde.plz),kundendatei:kundeDatei(S.kunde)});KW=null;schliesseModal();render();return;
    case'kw-ohne':KW=null;schliesseModal();return;
    case'oeffnen':document.getElementById('datei').click();return;
    case'addAnlage':S.projekt.anlagen.push(neueAnlage());break;
    case'delAnlage':S.projekt.anlagen.splice(i,1);['gem','ign'].forEach(n=>S.projekt[n]=verschiebeKeys(S.projekt[n]||{},i));break;
    case'addKern':{const a=S.projekt.anlagen[i];const g=neuesKernloch(1,false);g.offen=true;a.kern.push(g);a.geaendert=true;break}
    case'delKern':S.projekt.anlagen[i].kern.splice(k,1);S.projekt.anlagen[i].geaendert=true;break;
    case'kernPlus':case'kernMinus':{const a=S.projekt.anlagen[i],g=a.kern[k];g.anzahl=String(Math.max(0,(parseInt(g.anzahl)||0)+(act==='kernPlus'?1:-1)));g.auto=false;a.geaendert=true;break}
    case'kernOffen':e.preventDefault();S.projekt.anlagen[i].kern[k].offen=true;break;
    case'kundeSpeichern':case'kundeLaden':kundeSpeichern(act==='kundeLaden');return;
    case'projektSpeichern':case'projektLaden':projektSpeichern(act==='projektLaden',false);return;
    case'm-fix':{const e=MODAL&&MODAL.e;schliesseModal();if(e){if(S.projekt.ign)delete S.projekt.ign[e.key];persist();derived();fokus(e.fokus)}return}
    case'm-ign':{const e=MODAL&&MODAL.e;schliesseModal();if(e){S.projekt.ign[e.key]=e.sig;persist();derived()}pruefePopups();return}
    case'm-fokus':schliesseModal();fokus(t.dataset.v);return;
    case'm-trotzdem':schliesseModal();projektSpeichern(!!t.dataset.v,true);return;
    case'm-zu':KW=null;OW=null;schliesseModal();return;
    case'anmelden':anmelden();return;
    case'abmelden':lsDel(LS_TOKEN);toast('Abgemeldet');break;
    case'hochladen':hochladen().then(r=>toast(r.ok?'Upload abgeschlossen':'Upload nicht möglich: '+r.grund));return;
    case'kundenLaden':kundenLaden(false);return;
    case'ordnerWahl':OW=null;ordnerWahl(t.dataset.v);return;
    case'ow-in':{const f=OW.liste[i];OW.stapel.push({id:OW.id,pfad:OW.pfad});ordnerWahl(OW.feld,f.id,OW.pfad+'/'+f.name);return}
    case'ow-hoch':{const z=OW.stapel.pop()||{id:'root',pfad:'OneDrive'};ordnerWahl(OW.feld,z.id,z.pfad);return}
    case'ow-ok':S.einst[OW.feld]={id:OW.id,pfad:OW.pfad};OW=null;schliesseModal();persist();toast('Ordner gespeichert');if(S.view==='einst')render();return;
  }
  render()});
function anlageGeaendert(b){const m=/^projekt\.anlagen\.(\d+)\./.exec(b);if(m&&S.projekt&&S.projekt.anlagen[+m[1]])S.projekt.anlagen[+m[1]].geaendert=true}
function projektSig(p){return p?JSON.stringify(Object.assign({},p,{gem:null,ign:null})):''}
function verschiebeKeys(o,i){const r={};Object.entries(o).forEach(([k,v])=>{const m=k.match(/^([A-Z])(\d+)(.*)$/);if(!m)return;const n=+m[2];if(n===i)return;r[m[1]+(n>i?n-1:n)+m[3]]=v});return r}
function brauchtBestaetigung(act,t){
  if(act==='neuKunde')return Object.entries(S.kunde).some(([k,v])=>!['typ','anrede','ortAuto'].includes(k)&&str(v));
  if(act==='neuProjekt'||act==='neuProjektWahl')return!!S.projekt&&projektSig(S.projekt)!==S.projektGespeichert;
  if(act==='delAnlage'){const a=S.projekt&&S.projekt.anlagen[+t.dataset.i];return!!a&&!anlageLeer(a)}
  return false}
window.addEventListener('online',()=>{hochladen()});

render();
rueckkehrVonAnmeldung().then(()=>{if(navigator.onLine!==false)hochladen()});
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
