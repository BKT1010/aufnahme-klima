<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aufnahme Klima</title>
<meta name="theme-color" content="#1f5f8b">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--blau:#1f5f8b;--hell:#eef4f8;--rand:#c9d6df;--text:#1d2329;--grau:#5b6770;--rot:#b3261e;--rotbg:#fdecea;--gruen:#1e7b3a;--gruenbg:#e7f5ec;}
*{box-sizing:border-box}
html,body{margin:0;background:#f6f8fa;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px}
header{position:sticky;top:0;z-index:5;background:var(--blau);color:#fff;display:flex;align-items:center;gap:8px;padding:10px 14px;flex-wrap:wrap}
header h1{font-size:19px;margin:0 12px 0 0;font-weight:600}
header nav{display:flex;gap:6px;flex-wrap:wrap}
header nav button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:8px;padding:9px 16px;font-size:16px}
header nav button.on{background:#fff;color:var(--blau);font-weight:600}
main{max-width:980px;margin:0 auto;padding:16px 14px 65vh}
h2{font-size:21px;margin:8px 0 14px}
h3{font-size:18px;margin:0 0 10px}
h4{font-size:16px;margin:14px 0 8px;color:var(--grau);text-transform:uppercase;letter-spacing:.04em}
.card{background:#fff;border:1px solid var(--rand);border-radius:12px;padding:16px;margin-bottom:16px}
.sub{background:var(--hell);border:1px solid var(--rand);border-radius:10px;padding:12px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:14px;color:var(--grau)}
input,select,textarea{font:inherit;color:var(--text);border:1px solid var(--rand);border-radius:8px;padding:11px 12px;background:#fff;min-height:48px;width:100%}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blau);outline-offset:0}
.bad,.tog.bad button{border:2px solid var(--rot)!important;background:var(--rotbg)}
.tog{display:flex;flex-wrap:wrap;gap:6px}
.tog button{min-height:48px;padding:0 13px;border:1px solid var(--rand);background:#fff;border-radius:8px;font:inherit;color:var(--text)}
.tog button.on{background:var(--blau);border-color:var(--blau);color:#fff;font-weight:600}
.btn{min-height:52px;padding:0 20px;border-radius:10px;border:1px solid var(--blau);background:#fff;color:var(--blau);font:inherit;font-weight:600}
.btn.p{background:var(--blau);color:#fff}
.btn.del{border-color:var(--rot);color:var(--rot);min-height:40px;padding:0 12px;font-weight:500}
.btn.big{width:100%;min-height:64px;font-size:18px;margin-bottom:12px;text-align:left;padding:0 20px}
.btn.ort{min-height:44px;font-weight:500}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.info{font-size:14px;color:var(--grau)}
.auto{background:#f1f3f5;border-radius:8px;padding:11px 12px;min-height:48px;display:flex;align-items:center}
.ok{background:var(--gruenbg);color:var(--gruen);border-radius:8px;padding:10px 12px;font-weight:600;margin-top:6px}
.err{background:var(--rotbg);color:var(--rot);border-radius:8px;padding:10px 12px;font-weight:600;margin-top:6px}
.hint{background:#fff7e0;border:1px solid #f0d58a;border-radius:8px;padding:10px 12px;margin-top:6px}
.neutral{background:#f1f3f5;border-radius:8px;padding:10px 12px;margin-top:6px}
.fn{font-family:ui-monospace,monospace;font-size:15px;word-break:break-all}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:10px;max-width:90%;display:none;z-index:20}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:15;padding:16px}
#modal .box{background:#fff;border-radius:14px;max-width:560px;width:100%;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
#modal h3{color:var(--rot)}
#modal ul{padding-left:20px;margin:8px 0 16px}
.hidden{display:none}
</style>
</head>
<body>
<header>
  <h1>Aufnahme Klima</h1>
  <nav id="nav"></nav>
</header>
<main id="app"></main>
<input type="file" id="datei" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" class="hidden">
<div id="modal"><div class="box" id="modalbox"></div></div>
<div id="toast"></div>

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function leitungEingetragen(a){return a.innen.some(u=>num(u.leitung)!=null)}
function nachfuell(a){const d=a.daten;if(!d||d.vorgef==null||d.gpm==null||!leitungEingetragen(a))return null;return Math.max(0,leitungSumme(a)-d.vorgef)*d.gpm}
function kaeltemittel(a){return a.daten?(str(a.daten.km)||KM_STANDARD):str(a.kmDatei)}
function kernSumme(a){return a.kern.reduce((s,g)=>s+(parseInt(g.anzahl)||0),0)}
function vorschlag(p){
  if(p.anlagen.length>1)return p.anlagen.length+' Anlagen';
  const a=p.anlagen[0];if(!a||!a.art)return'';
  const rn=raumNamen(p);
  if(a.innen.length<=1){const r=rn['0.0'];return a.art+(r?' '+r:'')}
  return a.art+' '+a.innen.length+' Räume'}
function schluessel(p){return str(p.schluesselFrei)||vorschlag(p)}
function ralName(nr){const n=normRal(nr);if(!n)return'';const r=L.ral.find(x=>normRal(x.nr)===n);return r?r.name:''}
function kundeDatei(k){return dateiname(kundeName(k)+'_'+str(k.ort)+'_'+heute())+'.xlsx'}
function projektDatei(p){return dateiname(str(p.kunde)+'_'+str(p.ort)+'_'+schluessel(p))+'.xlsx'}

// Fehler (fachliche Prüfungen) – key, Anlage, Text, Signatur, Feld zum Korrigieren, Popup sofort?
function fehlerListe(p){
  const f=[];
  p.anlagen.forEach((a,i)=>{
    const A='Anlage '+(i+1)+': ',P='projekt.anlagen.'+i+'.',d=a.daten;
    if(a.art==='Multisplit'&&num(a.leistung)!=null&&leistungSumme(a)>num(a.leistung)+1e-9)
      f.push({key:'L'+i,i,popup:true,text:A+'Leistung zu hoch – '+fmt(leistungSumme(a))+' kW geplant, Außengerät max. '+fmt(num(a.leistung))+' kW',
        sig:a.aussen+'|'+a.innen.map(u=>u.typ).join(','),fokus:P+'innen.0.typ'});
    if(d&&d.maxL!=null&&leitungSumme(a)>d.maxL+1e-9){
      const j=Math.max(0,a.innen.findIndex(u=>num(u.leitung)!=null));
      f.push({key:'G'+i,i,popup:true,text:A+'Leitungslänge gesamt zu lang – '+fmt(leitungSumme(a))+' m, max. '+fmt(d.maxL)+' m',
        sig:d.maxL+'|'+a.innen.map(u=>num(u.leitung)).join(','),fokus:P+'innen.'+j+'.leitung'})}
    if(a.art==='Multisplit'&&d&&d.maxEinzel!=null)a.innen.forEach((u,j)=>{const l=num(u.leitung);
      if(l!=null&&l>d.maxEinzel+1e-9)f.push({key:'E'+i+'.'+j,i,popup:true,text:A+'Innengerät '+(j+1)+' Leitung zu lang – '+fmt(l)+' m, max. '+fmt(d.maxEinzel)+' m je Innengerät',
        sig:d.maxEinzel+'|'+l,fokus:P+'innen.'+j+'.leitung'})});
    const g=parseInt(a.kernGesamt);
    if(!(isNaN(g)&&a.kern.length===0)&&(isNaN(g)?0:g)!==kernSumme(a))
      f.push({key:'K'+i,i,popup:false,text:A+'Kernlöcher – '+kernSumme(a)+' vergeben, '+(isNaN(g)?0:g)+' gesamt',
        sig:a.kernGesamt+'|'+a.kern.map(x=>x.anzahl).join(','),fokus:P+(isNaN(g)?'kernGesamt':(a.kern.length?'kern.0.anzahl':'kernGesamt'))});
  });
  return f}
function istIgnoriert(p,e){return p.ign&&p.ign[e.key]===e.sig}
// Pflichtangaben
function fehlendeAngaben(p){
  const m=[];
  if(!str(p.kunde))m.push({text:'Kunde (Nachname / Firma)',path:'projekt.kunde',datei:true});
  if(!str(p.ort))m.push({text:'Ort',path:'projekt.ort',datei:true});
  if(!schluessel(p))m.push({text:'Schlüsselwort',path:'projekt.schluesselFrei',datei:true});
  p.anlagen.forEach((a,i)=>{const A='Anlage '+(i+1)+': ',P='projekt.anlagen.'+i+'.';
    if(!a.art){m.push({text:A+'Anlagenart',path:P+'art'});return}
    if(!a.hersteller){m.push({text:A+'Hersteller',path:P+'hersteller'});return}
    if(a.art==='Multisplit'&&!a.aussen)m.push({text:A+'Außengerät',path:P+'aussen'});
    a.innen.forEach((u,j)=>{if(!u.typ)m.push({text:A+'Innengerät '+(j+1)+' Typ',path:P+'innen.'+j+'.typ'})});
    if(a.lack==='Ja'&&!str(a.ralNr))m.push({text:A+'RAL-Nummer für Lackierung',path:P+'ralNr'});
  });
  return m}

// ---------- Listen ----------
function herstellerFuer(art){return uniq(art==='Singlesplit'?L.single.map(x=>x.h):L.mAussen.map(x=>x.h)).sort()}
function hatListen(){return L.single.length+L.mAussen.length+L.mInnen.length>0}

// ---------- Logik bei Änderungen ----------
function nachAenderung(path){
  if(path==='kunde.ort'){S.kunde.ortAuto=false;return}
  const m=path.match(/^projekt\.anlagen\.(\d+)\.(.+)$/);
  if(!m)return;
  const a=S.projekt.anlagen[+m[1]],f=m[2];
  if(f==='art'){const art=a.art,keep={montage:a.montage,blechTyp:a.blechTyp,blechLaenge:a.blechLaenge,blechAusf:a.blechAusf,lack:a.lack,ralNr:a.ralNr,kernGesamt:a.kernGesamt,kern:a.kern};
    Object.assign(a,neueAnlage(),keep,{art});a.innen=art==='Singlesplit'?[neuesInnen()]:[]}
  else if(f==='hersteller'){a.aussen='';a.leistung=null;a.daten=null;a.innen=a.art==='Singlesplit'?[keepInnen(a.innen[0])]:[]}
  else if(f==='aussen'&&a.art==='Multisplit'){
    const g=L.mAussen.find(x=>x.h===a.hersteller&&x.typ===a.aussen);
    a.leistung=g?g.max:null;const n=g?g.anzahl:0;
    while(a.innen.length<n)a.innen.push(neuesInnen());
    a.innen=a.innen.slice(0,n);a.daten=null;aktualisiereDaten(a)}
  else{const mi=f.match(/^innen\.(\d+)\.typ$/);
    if(mi){const u=a.innen[+mi[1]];
      if(a.art==='Singlesplit'){const k=L.single.find(x=>x.h===a.hersteller&&x.innen===u.typ);a.aussen=k?k.aussen:'';a.leistung=k?k.leistung:null;u.leistung=k?k.leistung:null;a.daten=null;aktualisiereDaten(a)}
      else{const k=L.mInnen.find(x=>x.h===a.hersteller&&x.typ===u.typ);u.leistung=k?k.leistung:null}}}
}
function keepInnen(u){const n=neuesInnen();if(!u)return n;return Object.assign(n,u,{typ:'',leistung:null})}

// ---------- Bausteine UI ----------
function cls(path){return MARK.has(path)?' bad':''}
function inp(path,ph,mode){const v=getP(S,path);return`<input data-b="${path}" class="${cls(path)}" value="${esc(v)}" placeholder="${esc(ph||'')}"${mode?` inputmode="${mode}"`:''} autocomplete="off">`}
function fld(label,html){return`<label class="f">${esc(label)}${html}</label>`}
function sel(path,opts,ph){const v=getP(S,path);let h=`<select data-b="${path}" data-r="1" class="${cls(path)}"><option value="">${esc(ph||'– bitte wählen –')}</option>`;
  let drin=false;opts.forEach(o=>{const val=typeof o==='object'?o.v:o,t=typeof o==='object'?o.t:o;if(val===v)drin=true;h+=`<option value="${esc(val)}"${val===v?' selected':''}>${esc(t)}</option>`});
  if(v&&!drin)h+=`<option value="${esc(v)}" selected>${esc(v)} (nicht in Liste)</option>`;
  return h+'</select>'}
function tog(path,opts){const v=getP(S,path);return`<div class="tog${cls(path)}" data-tog="${path}">${opts.map(o=>`<button type="button" data-act="set" data-b="${path}" data-v="${esc(o)}" class="${o===v?'on':''}">${esc(o)}</button>`).join('')}</div>`}

// ---------- Ansichten ----------
function render(){
  const y=window.scrollY;
  document.getElementById('nav').innerHTML=[['start','Start'],['kunde','Kunde'],['projekt','Projekt']].map(([v,t])=>`<button data-act="view" data-v="${v}" class="${S.view===v?'on':''}">${t}</button>`).join('');
  document.getElementById('app').innerHTML=S.view==='kunde'?vKunde():S.view==='projekt'?vProjekt():vStart();
  derived();persist();window.scrollTo(0,y)}

function vStart(){
  const st=hatListen()?`<div class="ok">Gerätelisten geladen: ${L.single.length} Singlesplit-Kombinationen, ${L.mAussen.length} Multisplit-Außengeräte, ${L.mInnen.length} Multisplit-Innengeräte, ${L.ral.length} RAL-Farben<br><span class="info">Stand ${esc(L.stand||'')} · ${esc(L.datei||'')}</span></div>`
    :`<div class="hint">Noch keine Gerätelisten geladen. Bitte die Gerätelisten-Datei öffnen (am besten zu Hause im WLAN aus OneDrive).</div>`;
  return`<h2>Start</h2>
  <button class="btn big p" data-act="neuKunde" data-confirm="1">Neuer Kunde</button>
  <button class="btn big" data-act="neuProjekt" data-confirm="1">Neues Projekt${str(kundeName(S.kunde))?' für '+esc(kundeName(S.kunde))+(str(S.kunde.ort)?', '+esc(S.kunde.ort):''):''}</button>
  <button class="btn big" data-act="oeffnen">Datei öffnen (Kunde, Projekt oder Gerätelisten)</button>
  <div class="card"><h3>Gerätelisten</h3>${st}<p class="info">Zum Aktualisieren die Gerätelisten-Datei erneut über „Datei öffnen“ laden. Die Listen bleiben danach offline auf dem Tablet gespeichert.</p></div>
  <p class="info">Eingaben werden laufend auf dem Tablet zwischengespeichert. Erst „Speichern“ erzeugt die Excel-Datei.</p>
  <p class="info">PLZ-Daten: © GeoNames (<a href="https://www.geonames.org/" target="_blank" rel="noopener">geonames.org</a>), Lizenz <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>, gefiltert und umformatiert.</p>`}

function vKunde(){
  const k=S.kunde,P='kunde.';
  return`<h2>Kunde</h2><div class="card">
  <div class="grid">
   ${fld('Kundentyp',tog(P+'typ',['Privat','Firma']))}
   ${k.typ==='Firma'?fld('Firmenname',inp(P+'firma')):''}
   ${fld('Anrede',tog(P+'anrede',['Herr','Frau']))}
  </div><div class="grid" style="margin-top:12px">
   ${fld('Vorname',inp(P+'vorname'))}${fld('Nachname',inp(P+'nachname'))}
   ${fld('Straße',inp(P+'strasse'))}${fld('Nr',inp(P+'nr'))}
   ${fld('PLZ',inp(P+'plz','','numeric'))}${fld('Ort',inp(P+'ort'))}
   <div id="plzwahl" style="grid-column:1/-1"></div>
   ${fld('Telefon',inp(P+'telefon','','tel'))}${fld('E-Mail',inp(P+'mail','','email'))}
  </div></div>
  <div class="card"><div class="info">Dateiname</div><div class="fn" id="kfn"></div>
   <div class="row" style="margin-top:12px"><button class="btn p" data-act="kundeTeilen">Speichern &amp; teilen</button><button class="btn" data-act="kundeLaden">Nur herunterladen</button><button class="btn" data-act="neuProjekt" data-confirm="1">Weiter: Neues Projekt</button></div></div>`}

function vProjekt(){
  if(!S.projekt)return`<h2>Projekt</h2><div class="hint">Noch kein Projekt angelegt.</div><p><button class="btn p" data-act="neuProjekt">Neues Projekt anlegen</button></p>`;
  const p=S.projekt;
  let h=`<h2>Projekt</h2>${hatListen()?'':'<div class="hint">Keine Gerätelisten geladen – Hersteller und Typen können nicht ausgewählt werden.</div>'}
  <div class="card"><div class="grid">${fld('Kunde (Nachname / Firma)',inp('projekt.kunde'))}${fld('Ort',inp('projekt.ort'))}</div></div>`;
  p.anlagen.forEach((a,i)=>{h+=vAnlage(a,i,p.anlagen.length)});
  h+=`<p><button class="btn" data-act="addAnlage">+ Anlage hinzufügen</button></p>
  <div class="card"><h3>Notizen</h3><textarea data-b="projekt.notizen" placeholder="Freie Notizen zum Projekt">${esc(p.notizen)}</textarea></div>
  <div class="card"><h3>Schlüsselwort &amp; Datei</h3>
   <div class="grid">${fld('Vorschlag',`<div class="auto" id="vs"></div>`)}${fld('Eigenes Schlüsselwort (überschreibt Vorschlag)',inp('projekt.schluesselFrei','z. B. Klima Schlafzimmer'))}</div>
   <div class="info" style="margin-top:12px">Dateiname</div><div class="fn" id="pfn"></div>
   <div id="pruef" style="margin-top:12px"></div>
   <div class="row" style="margin-top:12px"><button class="btn p" data-act="projektTeilen">Speichern &amp; teilen</button><button class="btn" data-act="projektLaden">Nur herunterladen</button></div></div>`;
  return h}

function vAnlage(a,i,anz){
  const P='projekt.anlagen.'+i+'.';
  let h=`<div class="card"><div class="between"><h3>Anlage ${i+1}</h3>${anz>1?`<button class="btn del" data-act="delAnlage" data-i="${i}" data-confirm="1">Anlage entfernen</button>`:''}</div>
  <div class="grid">${fld('Anlagenart',tog(P+'art',['Singlesplit','Multisplit']))}
  ${a.art?fld('Hersteller',sel(P+'hersteller',herstellerFuer(a.art))):''}</div>`;
  if(!a.art)return h+'</div>';
  if(a.hersteller){
    if(a.art==='Singlesplit'){
      const ks=L.single.filter(x=>x.h===a.hersteller);
      h+=`<div class="grid" style="margin-top:12px">${fld('Innengerät',sel(P+'innen.0.typ',ks.map(x=>({v:x.innen,t:x.innen+(x.leistung!=null?' ('+fmt(x.leistung)+' kW)':'')}))))}
      ${fld('Außengerät (automatisch)',`<div class="auto">${esc(a.aussen||'–')}</div>`)}
      ${fld('Leistung (automatisch)',`<div class="auto">${a.leistung!=null?fmt(a.leistung)+' kW':'–'}</div>`)}</div>`;
    }else{
      const as=L.mAussen.filter(x=>x.h===a.hersteller);
      h+=`<div class="grid" style="margin-top:12px">${fld('Außengerät',sel(P+'aussen',as.map(x=>({v:x.typ,t:x.typ+' – '+x.anzahl+' Innengeräte, max. '+fmt(x.max)+' kW'}))))}</div>`;
    }
  }
  h+=`<h4>Außeneinheit</h4><div class="grid">
   ${fld('Montage',tog(P+'montage',['Bodenkonsole','Wandkonsole']))}
   ${fld('Blechkanal Typ',sel(P+'blechTyp',BLECH))}
   ${fld('Blechkanal Länge (m)',inp(P+'blechLaenge','','decimal'))}
   ${fld('Blechkanal Ausführung',tog(P+'blechAusf',['RAL 9010','Verzinkt']))}
   ${fld('Lackierung Außengerät',tog(P+'lack',['Nein','Ja']))}
   ${a.lack==='Ja'?fld('RAL-Nummer',inp(P+'ralNr','z. B. 7016','numeric'))+fld('Farbname (automatisch)',`<div class="auto" id="ral-${i}"></div>`):''}
  </div>`;
  if(a.innen.length){
    h+=`<h4>Innengeräte</h4>`;
    const mi=L.mInnen.filter(x=>x.h===a.hersteller);
    a.innen.forEach((u,j)=>{const Q=P+'innen.'+j+'.';
      h+=`<div class="sub"><h3>Innengerät ${j+1}${a.art==='Singlesplit'&&u.typ?': '+esc(u.typ):''}</h3><div class="grid">
      ${a.art==='Multisplit'?fld('Typ',sel(Q+'typ',mi.map(x=>({v:x.typ,t:x.typ+(x.leistung!=null?' ('+fmt(x.leistung)+' kW)':'')}))))+fld('Nennleistung',`<div class="auto">${u.leistung!=null?fmt(u.leistung)+' kW':'–'}</div>`):''}
      ${fld('Raum',sel(Q+'raum',RAEUME))}
      ${fld('Raum frei (überschreibt Auswahl)',inp(Q+'raumFrei','z. B. Kinderzimmer Max'))}
      ${fld('Raumname im Ergebnis',`<div class="auto" id="rn-${i}-${j}"></div>`)}
      ${fld('Leitungslänge zur Außeneinheit (m)',inp(Q+'leitung','','decimal'))}
      ${fld('Kondensatpumpe',tog(Q+'pumpe',['Nein','Ja']))}
      ${fld('Kabelkanal Typ',sel(Q+'kanalTyp',KANAL))}
      ${fld('Kabelkanal Länge (m)',inp(Q+'kanalLaenge','','decimal'))}
      </div></div>`});
    h+=`<div id="info-${i}"></div>`;
  }
  h+=`<h4>Kernlöcher</h4><div class="grid">${fld('Anzahl gesamt',inp(P+'kernGesamt','','numeric'))}</div>`;
  a.kern.forEach((g,k)=>{const Q=P+'kern.'+k+'.';
    h+=`<div class="sub"><div class="between"><h3>Gruppe ${k+1}</h3><button class="btn del" data-act="delKern" data-i="${i}" data-k="${k}">Entfernen</button></div><div class="grid">
    ${fld('Anzahl',inp(Q+'anzahl','','numeric'))}
    ${fld('Durchmesser (mm)',tog(Q+'d',DURCHM))}
    ${fld('Lage',tog(Q+'lage',['Wand','Decke']))}
    ${fld('Material',tog(Q+'material',MATERIAL))}</div></div>`});
  h+=`<div class="row" style="margin-top:10px"><button class="btn" data-act="addKern" data-i="${i}">+ Kernloch-Gruppe</button></div><div id="kc-${i}" style="margin-top:4px"></div></div>`;
  return h}

// ---------- abgeleitete Anzeigen (ohne Neuaufbau) ----------
function setT(id,t){const e=document.getElementById(id);if(e)e.textContent=t}
function zeile(c,t){return`<div class="${c}">${esc(t)}</div>`}
function derived(){
  if(S.view==='kunde'){setT('kfn',kundeDatei(S.kunde));
    const w=document.getElementById('plzwahl');if(w){const o=orteZu(str(S.kunde.plz));let h='';
      if(o&&o.length>1)h=`<div class="info">Mehrere Orte zur PLZ ${esc(S.kunde.plz)} – bitte wählen:</div><div class="row" style="margin-top:6px">${o.map(x=>`<button class="btn ort" data-act="ortwahl" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div>`;
      else if(o&&o.length===0)h=`<div class="info">PLZ ${esc(S.kunde.plz)} nicht in der Liste – Ort bitte selbst eintragen.</div>`;
      w.innerHTML=h}}
  if(S.view==='projekt'&&S.projekt){const p=S.projekt,rn=raumNamen(p),fl=fehlerListe(p);
    setT('vs',vorschlag(p)||'–');setT('pfn',projektDatei(p));
    p.anlagen.forEach((a,i)=>{
      a.innen.forEach((u,j)=>setT('rn-'+i+'-'+j,rn[i+'.'+j]||'–'));
      if(a.lack==='Ja')setT('ral-'+i,ralName(a.ralNr)||(str(a.ralNr)?'nicht in RAL-Liste':'–'));
      const fi=fl.filter(e=>e.i===i),txt=e=>e.text.replace(/^Anlage \d+: /,'')+(istIgnoriert(p,e)?' (ignoriert)':'');
      const box=document.getElementById('info-'+i);
      if(box){let h='';const d=a.daten;
        if(a.art==='Multisplit'&&num(a.leistung)!=null&&a.innen.some(u=>u.leistung!=null)&&!fi.some(e=>e.key==='L'+i))h+=zeile('ok','Leistung in Ordnung: '+fmt(leistungSumme(a))+' von max. '+fmt(num(a.leistung))+' kW');
        fi.filter(e=>e.key[0]!=='K').forEach(e=>h+=zeile('err',txt(e)));
        if(d){
          if(d.maxL==null)h+=zeile('hint','Max. Leitungslänge fehlt in der Geräteliste – Prüfung übersprungen');
          else if(leitungEingetragen(a)&&!fi.some(e=>e.key==='G'+i))h+=zeile('ok','Leitungslänge gesamt: '+fmt(leitungSumme(a))+' von max. '+fmt(d.maxL)+' m');
          if(a.art==='Multisplit'&&d.maxEinzel==null)h+=zeile('hint','Max. Länge je Innengerät fehlt in der Geräteliste – Prüfung übersprungen');
          const nf=nachfuell(a);
          if(d.vorgef==null||d.gpm==null)h+=zeile('hint','Nachfüllmenge nicht berechenbar – vorgefüllte Länge oder g/m fehlt in der Geräteliste');
          else h+=zeile('neutral','Kältemittel '+kaeltemittel(a)+' · vorgefüllt '+fmt(d.vorgef)+' m · Nachfüllmenge: '+(nf==null?'– (Leitungslängen eintragen)':fmt(nf)+' g'));
        }else if(a.innen.some(u=>u.typ)||a.aussen)h+=zeile('hint','Gerät nicht in der geladenen Geräteliste – Leitungsprüfung und Nachfüllmenge nicht möglich');
        box.innerHTML=h}
      const kc=document.getElementById('kc-'+i);
      if(kc){const ke=fi.find(e=>e.key==='K'+i);const g=parseInt(a.kernGesamt);
        kc.innerHTML=ke?zeile('err',txt(ke)):(isNaN(g)&&!a.kern.length?'':zeile('ok','Alle Kernlöcher vergeben: '+kernSumme(a)+' von '+(isNaN(g)?0:g)))}
    });
    const pr=document.getElementById('pruef');if(pr){const fa=fehlendeAngaben(p),offen=fl.filter(e=>!istIgnoriert(p,e));
      pr.innerHTML=(fa.length?zeile('hint','Es fehlt: '+fa.map(x=>x.text).join(', ')):'')+(offen.length?`<div class="err">Offene Fehler:<ul style="margin:6px 0 0;padding-left:20px;font-weight:500">${offen.map(e=>'<li>'+esc(e.text)+'</li>').join('')}</ul></div>`:'')+(!fa.length&&!offen.length?zeile('ok','Alle Prüfungen in Ordnung.'):'')}}
}

// ---------- Pop-ups ----------
let MODAL=null;
function zeigeModal(html,ctx){MODAL=ctx;document.getElementById('modalbox').innerHTML=html;document.getElementById('modal').style.display='flex'}
function schliesseModal(){MODAL=null;document.getElementById('modal').style.display='none'}
function pruefePopups(){
  if(MODAL||S.view!=='projekt'||!S.projekt)return;
  const p=S.projekt;p.gem=p.gem||{};p.ign=p.ign||{};
  const fl=fehlerListe(p),keys=new Set(fl.map(e=>e.key));
  Object.keys(p.gem).forEach(k=>{if(!keys.has(k))delete p.gem[k]});
  Object.keys(p.ign).forEach(k=>{if(!keys.has(k))delete p.ign[k]});
  const e=fl.find(e=>e.popup&&p.gem[e.key]!==e.sig);
  persist();
  if(!e)return;
  p.gem[e.key]=e.sig;persist();
  zeigeModal(`<h3>Fehler</h3><p>${esc(e.text)}</p><div class="row"><button class="btn p" data-act="m-fix">Korrigieren</button><button class="btn" data-act="m-ign">Ignorieren</button></div>`,{art:'fehler',e})}
function fokus(path){
  const el=q(path);if(!el)return;MARK.add(path);el.classList.add('bad');
  if(el.tagName==='BUTTON'||el.closest('.tog')){scrollZu(el)}else{el.focus({preventScroll:true});scrollZu(el)}}

// ---------- Scrollen ----------
function scrollZu(el){
  const lab=el.closest('label.f')||el.closest('.tog')||el;
  const head=document.querySelector('header').offsetHeight;
  const ziel=lab.getBoundingClientRect().top+window.scrollY-head-95; // Platz für die Zeile darüber
  window.scrollTo({top:Math.max(0,ziel),behavior:'smooth'})}
document.addEventListener('focusin',e=>{const t=e.target;if(!t.matches||!t.matches('main input,main select,main textarea'))return;
  setTimeout(()=>scrollZu(t),60);setTimeout(()=>{if(document.activeElement===t)scrollZu(t)},450)});

// ---------- Excel schreiben ----------
function blobAus(wb){return new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:MIME})}
function blatt(wb,name,rows,breiten){const ws=XLSX.utils.aoa_to_sheet(rows);if(breiten)ws['!cols']=breiten.map(w=>({wch:w}));XLSX.utils.book_append_sheet(wb,ws,name)}
const KFELDER=[['Typ','typ'],['NameFirma','firma'],['Anrede','anrede'],['Vorname','vorname'],['Nachname','nachname'],['Straße','strasse'],['Nr','nr'],['Plz','plz'],['Ort','ort'],['Telefon','telefon'],['Mail','mail']];
function wbKunde(k){const wb=XLSX.utils.book_new();
  blatt(wb,'Kunde',[['Feld','Wert']].concat(KFELDER.map(([n,f])=>[n,f==='firma'&&k.typ!=='Firma'?'':str(k[f])])),[14,40]);return wb}
function wbProjekt(p){const wb=XLSX.utils.book_new(),rn=raumNamen(p),fl=fehlerListe(p);
  blatt(wb,'Allgemein',[['Feld','Wert'],['Kunde',str(p.kunde)],['Ort',str(p.ort)],['Datum',p.datum],['Schlüsselwort',schluessel(p)],['Anzahl Anlagen',p.anlagen.length],['Notizen',str(p.notizen)]],[16,60]);
  const an=[['Anlage','Anlagenart','Hersteller','Außengerät','Leistung kW','Anzahl Innengeräte','Montage','Blechkanal Typ','Blechkanal Länge m','Blechkanal Ausführung','Lackierung','RAL-Nummer','RAL-Farbname','Kernlöcher gesamt','Kältemittel','Leitungslänge gesamt m','Nachfüllmenge g','Hinweise']];
  const ig=[['Anlage','Innengerät Nr','Typ','Nennleistung kW','Raum','Leitungslänge m','Kondensatpumpe','Kabelkanal Typ','Kabelkanal Länge m']];
  const kl=[['Anlage','Gruppe','Anzahl','Durchmesser mm','Lage','Material']];
  p.anlagen.forEach((a,i)=>{
    const hinw=fl.filter(e=>e.i===i&&istIgnoriert(p,e)).map(e=>e.text.replace(/^Anlage \d+: /,'')+' (ignoriert)').join('; ');
    an.push([i+1,a.art,a.hersteller,a.aussen,num(a.leistung),a.innen.length,a.montage,a.blechTyp,num(a.blechLaenge),a.blechAusf,a.lack,a.lack==='Ja'?str(a.ralNr):'',a.lack==='Ja'?ralName(a.ralNr):'',a.kernGesamt===''?null:parseInt(a.kernGesamt),
      kaeltemittel(a),leitungEingetragen(a)?leitungSumme(a):null,nachfuell(a),hinw]);
    a.innen.forEach((u,j)=>ig.push([i+1,j+1,u.typ,num(u.leistung),rn[i+'.'+j]||'',num(u.leitung),u.pumpe,u.kanalTyp,num(u.kanalLaenge)]));
    a.kern.forEach((g,k)=>kl.push([i+1,k+1,parseInt(g.anzahl)||null,g.d?parseInt(g.d):null,g.lage||'',g.material||'']));
  });
  blatt(wb,'Anlagen',an,[7,12,14,22,11,10,13,18,10,12,10,10,16,10,11,12,12,50]);
  blatt(wb,'Innengeräte',ig,[7,7,22,12,18,12,12,16,12]);
  blatt(wb,'Kernlöcher',kl,[7,7,8,12,8,12]);
  return wb}

let DL=null;try{if(window.claude&&typeof window.claude.use==='function')window.claude.use('downloads').then(d=>{DL=d}).catch(()=>{})}catch(e){}
async function ausgeben(wb,name,teilen){
  const blob=blobAus(wb);
  if(DL){try{await DL.save({filename:name,data:blob});toast('Gespeichert: '+name)}catch(e){if(!(e&&e.code==='declined'))toast('Speichern nicht möglich'+(e&&e.message?': '+e.message:''))}return}
  if(teilen){try{const f=new File([blob],name,{type:MIME});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});toast('Geteilt: '+name);return}}
    catch(e){if(e&&e.name==='AbortError')return}}
  const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),10000);
  toast((teilen?'Teilen nicht verfügbar – heruntergeladen: ':'Heruntergeladen: ')+name)}

// ---------- Speichern mit Prüfung ----------
function kundeSpeichern(teilen){
  const k=S.kunde,fehlt=[];
  if(k.typ==='Firma'&&!str(k.firma))fehlt.push(['Firmenname','kunde.firma']);
  if(k.typ!=='Firma'&&!str(k.nachname))fehlt.push(['Nachname','kunde.nachname']);
  if(!str(k.ort))fehlt.push(['Ort','kunde.ort']);
  if(fehlt.length){fehlt.forEach(([,p])=>{MARK.add(p);const el=q(p);if(el)el.classList.add('bad')});
    toast('Für den Dateinamen fehlt: '+fehlt.map(x=>x[0]).join(', '));fokus(fehlt[0][1]);return}
  ausgeben(wbKunde(k),kundeDatei(k),teilen)}
function projektSpeichern(teilen,trotzdem){
  const p=S.projekt,fa=fehlendeAngaben(p),offen=fehlerListe(p).filter(e=>!istIgnoriert(p,e));
  const datei=fa.filter(x=>x.datei);
  if(datei.length){datei.forEach(x=>MARK.add(x.path));render();
    zeigeModal(`<h3>Angaben fehlen</h3><p>Für den Dateinamen fehlt:</p><ul>${datei.map(x=>'<li>'+esc(x.text)+'</li>').join('')}</ul><div class="row"><button class="btn p" data-act="m-fokus" data-v="${esc(datei[0].path)}">Korrigieren</button></div>`,{art:'info'});return}
  if((fa.length||offen.length)&&!trotzdem){fa.forEach(x=>MARK.add(x.path));render();
    const erstes=fa.length?fa[0].path:offen[0].fokus;
    zeigeModal(`<h3>Bitte prüfen</h3>${fa.length?`<p>Es fehlt:</p><ul>${fa.map(x=>'<li>'+esc(x.text)+'</li>').join('')}</ul>`:''}${offen.length?`<p>Offene Fehler:</p><ul>${offen.map(e=>'<li>'+esc(e.text)+'</li>').join('')}</ul>`:''}
      <div class="row"><button class="btn p" data-act="m-fokus" data-v="${esc(erstes)}">Korrigieren</button><button class="btn" data-act="m-trotzdem" data-v="${teilen?'1':''}">Trotzdem speichern</button></div>`,{art:'speichern'});return}
  if(trotzdem){p.ign=p.ign||{};offen.forEach(e=>{p.ign[e.key]=e.sig;p.gem=p.gem||{};p.gem[e.key]=e.sig});persist();derived()}
  ausgeben(wbProjekt(p),projektDatei(p),teilen)}

// ---------- Excel lesen ----------
function zeilen(wb,n){const ws=wb.Sheets[n];return ws?XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true}):[]}
async function oeffneDatei(file){
  let wb;try{wb=XLSX.read(await file.arrayBuffer(),{type:'array'})}catch(e){toast('Datei konnte nicht gelesen werden');return}
  const n=wb.SheetNames;
  if(n.includes('Anlagen')&&n.includes('Allgemein'))return ladeProjekt(wb);
  if(n.includes('Kunde'))return ladeKunde(wb);
  if(n.some(x=>['Singlesplit','Multi_Aussen','Multi_Innen','RAL'].includes(x)))return ladeListen(wb,file.name);
  toast('Unbekannter Dateiaufbau – erwartet: Kunde, Projekt oder Gerätelisten')}
function ladeListen(wb,name){
  const d=n=>zeilen(wb,n).slice(1).filter(r=>str(r[0])!=='');
  L={single:d('Singlesplit').filter(r=>str(r[1])).map(r=>({h:str(r[0]),innen:str(r[1]),aussen:str(r[2]),leistung:num(r[3]),maxL:num(r[4]),vorgef:num(r[5]),gpm:num(r[6]),km:str(r[7])})),
     mAussen:d('Multi_Aussen').filter(r=>str(r[1])).map(r=>({h:str(r[0]),typ:str(r[1]),anzahl:parseInt(r[2])||0,max:num(r[3]),maxL:num(r[4]),maxEinzel:num(r[5]),vorgef:num(r[6]),gpm:num(r[7]),km:str(r[8])})),
     mInnen:d('Multi_Innen').filter(r=>str(r[1])).map(r=>({h:str(r[0]),typ:str(r[1]),leistung:num(r[2])})),
     ral:d('RAL').map(r=>({nr:str(r[0]),name:str(r[1])})),
     stand:new Date().toLocaleString('de-DE'),datei:name};
  lsSet(LS_LISTEN,L);
  if(S.projekt)S.projekt.anlagen.forEach(aktualisiereDaten);
  toast('Gerätelisten geladen');render()}
function ladeKunde(wb){
  const r=zeilen(wb,'Kunde');if(r.length<2){toast('Kundendatei ist leer');return}
  let g;
  if(str(r[0][0])==='Feld'){const m={};r.slice(1).forEach(z=>m[str(z[0])]=str(z[1]));g=k=>m[k]||''}
  else{const h=r[0].map(str),v=r[1];g=k=>{const i=h.indexOf(k);return i<0?'':str(v[i])}}
  const k=neuerKunde();KFELDER.forEach(([n,f])=>k[f]=g(n));
  k.typ=k.typ==='Firma'?'Firma':'Privat';k.anrede=k.anrede==='Frau'?'Frau':'Herr';
  S.kunde=k;S.view='kunde';MARK.clear();toast('Kunde geöffnet');render()}
function ladeProjekt(wb){
  const al={};zeilen(wb,'Allgemein').slice(1).forEach(r=>al[str(r[0])]=r[1]);
  const p={kunde:str(al['Kunde']),ort:str(al['Ort']),datum:str(al['Datum'])||heute(),schluesselFrei:'',notizen:str(al['Notizen']),anlagen:[],gem:{},ign:{}};
  const dez=v=>v===''||v==null?'':String(v).replace('.',',');
  const hinweise=[];
  zeilen(wb,'Anlagen').slice(1).filter(r=>str(r[0])).forEach(r=>{
    const a=neueAnlage();Object.assign(a,{art:str(r[1]),hersteller:str(r[2]),aussen:str(r[3]),leistung:num(r[4]),montage:str(r[6]),blechTyp:str(r[7]),blechLaenge:dez(r[8]),blechAusf:str(r[9]),lack:str(r[10])==='Ja'?'Ja':'Nein',ralNr:str(r[11]),kernGesamt:r[13]===''?'':String(r[13]),kmDatei:str(r[14])});
    const idx=(parseInt(r[0])||p.anlagen.length+1)-1;p.anlagen[idx]=a;hinweise[idx]=str(r[17])});
  p.anlagen=p.anlagen.filter(Boolean);if(!p.anlagen.length)p.anlagen=[neueAnlage()];
  zeilen(wb,'Innengeräte').slice(1).filter(r=>str(r[0])).forEach(r=>{const a=p.anlagen[parseInt(r[0])-1];if(!a)return;
    const u=neuesInnen(),raum=str(r[4]),base=raum.replace(/\s+\d+$/,'');
    if(RAEUME.includes(raum))u.raum=raum;else if(RAEUME.includes(base)&&/\s+\d+$/.test(raum))u.raum=base;else u.raumFrei=raum;
    Object.assign(u,{typ:str(r[2]),leistung:num(r[3]),leitung:dez(r[5]),pumpe:str(r[6])==='Ja'?'Ja':'Nein',kanalTyp:str(r[7]),kanalLaenge:dez(r[8])});
    a.innen[(parseInt(r[1])||a.innen.length+1)-1]=u});
  zeilen(wb,'Kernlöcher').slice(1).filter(r=>str(r[0])).forEach(r=>{const a=p.anlagen[parseInt(r[0])-1];if(!a)return;
    a.kern.push({anzahl:r[2]===''?'':String(r[2]),d:r[3]===''?'':String(r[3]),lage:str(r[4]),material:str(r[5])})});
  p.anlagen.forEach(a=>{a.innen=Array.from(a.innen,u=>u||neuesInnen());aktualisiereDaten(a)});
  // bereits ignorierte Fehler wieder als ignoriert übernehmen
  fehlerListe(p).forEach(e=>{if(hinweise[e.i]&&hinweise[e.i].includes(e.text.replace(/^Anlage \d+: /,'').split(' – ')[0])){p.ign[e.key]=e.sig}p.gem[e.key]=e.sig});
  const sw=str(al['Schlüsselwort']);if(sw&&sw!==vorschlag(p))p.schluesselFrei=sw;
  S.projekt=p;S.view='projekt';MARK.clear();toast('Projekt geöffnet');render()}

// ---------- Ereignisse ----------
function unmark(path,el){if(MARK.delete(path)){if(el)el.classList.remove('bad');const t=document.querySelector(`[data-tog="${CSS.escape(path)}"]`);if(t)t.classList.remove('bad')}}
document.addEventListener('input',e=>{const t=e.target,b=t.dataset&&t.dataset.b;if(!b||t.dataset.r)return;
  setP(S,b,t.value);unmark(b,t);
  if(b==='kunde.ort')S.kunde.ortAuto=false;
  if(b==='kunde.plz'){const o=orteZu(str(t.value));
    if(o&&o.length===1&&(!str(S.kunde.ort)||S.kunde.ortAuto)){S.kunde.ort=o[0];S.kunde.ortAuto=true;const oe=q('kunde.ort');if(oe)oe.value=o[0];unmark('kunde.ort',oe)}}
  persist();derived()});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='datei'){if(t.files[0])oeffneDatei(t.files[0]);t.value='';return}
  const b=t.dataset&&t.dataset.b;if(!b)return;
  if(t.dataset.r){setP(S,b,t.value);unmark(b,t);nachAenderung(b);render()}
  pruefePopups()});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const act=t.dataset.act;
  if(t.dataset.confirm&&brauchtBestaetigung(act)&&!t.dataset.armed){t.dataset.armed='1';const alt=t.textContent;t.textContent='Aktuelle Eingaben werden ersetzt – nochmal tippen';setTimeout(()=>{if(t.isConnected){t.textContent=alt;delete t.dataset.armed}},4000);return}
  const i=+t.dataset.i,k=+t.dataset.k;
  switch(act){
    case'view':S.view=t.dataset.v;MARK.clear();break;
    case'set':{const b=t.dataset.b;setP(S,b,t.dataset.v);unmark(b);nachAenderung(b);render();pruefePopups();return}
    case'ortwahl':S.kunde.ort=t.dataset.v;S.kunde.ortAuto=true;unmark('kunde.ort');{const oe=q('kunde.ort');if(oe)oe.value=t.dataset.v}persist();derived();return;
    case'neuKunde':S.kunde=neuerKunde();S.view='kunde';MARK.clear();break;
    case'neuProjekt':S.projekt=neuesProjekt(S.kunde);S.view='projekt';MARK.clear();break;
    case'oeffnen':document.getElementById('datei').click();return;
    case'addAnlage':S.projekt.anlagen.push(neueAnlage());break;
    case'delAnlage':S.projekt.anlagen.splice(i,1);['gem','ign'].forEach(n=>S.projekt[n]=verschiebeKeys(S.projekt[n]||{},i));break;
    case'addKern':S.projekt.anlagen[i].kern.push({anzahl:'',d:'',lage:'',material:''});break;
    case'delKern':S.projekt.anlagen[i].kern.splice(k,1);break;
    case'kundeTeilen':case'kundeLaden':kundeSpeichern(act==='kundeTeilen');return;
    case'projektTeilen':case'projektLaden':projektSpeichern(act==='projektTeilen',false);return;
    case'm-fix':{const e=MODAL&&MODAL.e;schliesseModal();if(e){if(S.projekt.ign)delete S.projekt.ign[e.key];persist();derived();fokus(e.fokus)}return}
    case'm-ign':{const e=MODAL&&MODAL.e;schliesseModal();if(e){S.projekt.ign[e.key]=e.sig;persist();derived()}pruefePopups();return}
    case'm-fokus':schliesseModal();fokus(t.dataset.v);return;
    case'm-trotzdem':schliesseModal();projektSpeichern(!!t.dataset.v,true);return;
  }
  render()});
function verschiebeKeys(o,i){const r={};Object.entries(o).forEach(([k,v])=>{const m=k.match(/^([A-Z])(\d+)(.*)$/);if(!m)return;const n=+m[2];if(n===i)return;r[m[1]+(n>i?n-1:n)+m[3]]=v});return r}
function brauchtBestaetigung(act){
  if(act==='neuKunde')return Object.entries(S.kunde).some(([k,v])=>!['typ','anrede','ortAuto'].includes(k)&&str(v));
  if(act==='neuProjekt')return!!S.projekt;
  if(act==='delAnlage')return true;
  return false}

render();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
